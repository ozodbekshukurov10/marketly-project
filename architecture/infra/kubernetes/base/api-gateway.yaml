apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-go
  namespace: marketly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-go
  template:
    metadata:
      labels:
        app: api-gateway-go
    spec:
      containers:
        - name: api-gateway-go
          image: REGION-docker.pkg.dev/PROJECT_ID/marketly/api-gateway-go:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-go
  namespace: marketly
spec:
  selector:
    app: api-gateway-go
  ports:
    - port: 80
      targetPort: 8080
