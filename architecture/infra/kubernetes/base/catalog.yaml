apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-go
  namespace: marketly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-go
  template:
    metadata:
      labels:
        app: catalog-go
    spec:
      containers:
        - name: catalog-go
          image: REGION-docker.pkg.dev/PROJECT_ID/marketly/catalog-go:latest
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-go
  namespace: marketly
spec:
  selector:
    app: catalog-go
  ports:
    - port: 80
      targetPort: 8081
