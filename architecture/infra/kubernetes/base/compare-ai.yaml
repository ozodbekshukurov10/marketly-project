apiVersion: apps/v1
kind: Deployment
metadata:
  name: compare-ai-cpp
  namespace: marketly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compare-ai-cpp
  template:
    metadata:
      labels:
        app: compare-ai-cpp
    spec:
      containers:
        - name: compare-ai-cpp
          image: REGION-docker.pkg.dev/PROJECT_ID/marketly/compare-ai-cpp:latest
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: compare-ai-cpp
  namespace: marketly
spec:
  selector:
    app: compare-ai-cpp
  ports:
    - port: 80
      targetPort: 8083
