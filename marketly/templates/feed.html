<!DOCTYPE html>
<html lang="uz">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketly - E'lonlar Tasmasi</title>
    <link rel="stylesheet" href="{% static 'css/feed.css' %}">
    <link rel="stylesheet" href="{% static 'css/ios26-ui.css' %}">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body class="ios26-ui">

    <!-- Yuqori Navigatsiya -->
    <header class="feed-header">
        <div class="container header-flex">
            <div class="logo" onclick="window.location.href='index.html'">
                <img class="logo-mark" src="{% static 'images/marketly-logo.svg' %}" alt="Marketly logo">
                Marketly<span>.</span>
            </div>

            <div class="search-wrapper">
                <input type="text" id="searchInput" oninput="searchProducts()" placeholder="Mahsulotlarni qidirish...">
                <button class="search-btn">Qidirish</button>
            </div>

            <div class="user-menu">
                <a href="kabinet.html" class="cabinet-btn">
                    <span class="icon">👤</span>
                    <span id="cabinetText">Kirish</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Asosiy Kontent -->
    <main class="container">
        <div class="feed-info">
            <h1>Barcha e'lonlar</h1>
            <p id="productCount">Yuklanmoqda...</p>
        </div>

        <!-- Mahsulotlar To'plami (Grid) -->
        <div class="product-grid" id="productGrid">
            <!-- JavaScript orqali to'ldiriladi -->
        </div>
    </main>

    <script src="{% static 'js/database.js' %}"></script>
    <script>
        // 1. Ma'lumotlar bazasi (Demo mahsulotlar)
        const allProducts = (window.productsData || []).map((item, index) => ({
            ...item,
            rating: ["4.9", "4.7", "5.0", "4.8", "4.6", "4.9"][index % 6]
        }));

        // 2. Mahsulotlarni ekranga chiqarish funksiyasi
        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            const countLabel = document.getElementById('productCount');
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = `<div class="no-results">Hech narsa topilmadi 😕</div>`;
                countLabel.innerText = "0 ta mahsulot";
                return;
            }

            countLabel.innerText = `${products.length} ta mahsulot topildi`;

            products.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">
                            <img src="${item.img}" alt="${item.title}" onerror="handleImageError(this, '${item.backupImg || item.img}')">
                            <button class="wishlist-btn">♡</button>
                        </div>
                        <div class="product-details">
                            <h3 class="product-title">${item.title}</h3>
                            <div class="product-rating">⭐️ ${item.rating} (45 sharh)</div>
                            <div class="product-footer">
                                <span class="product-price">${item.price} UZS</span>
                                <button class="cart-btn">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 3. Qidiruv mantiqi
        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.title.toLowerCase().includes(query)
            );
            displayProducts(filtered);
        }

        // 4. Sahifa yuklanganda bajariladigan ishlar
        window.onload = function() {
            // Mahsulotlarni chiqarish
            displayProducts(allProducts);

            // Xotiradan foydalanuvchi ismini tekshirish
            const savedData = localStorage.getItem('marketly_profile');
            if (savedData) {
                const user = JSON.parse(savedData);
                if (user.firstname) {
                    document.getElementById('cabinetText').innerText = user.firstname;
                }
            }
        };
        // feed.html ichidagi renderGrid funksiyasiga qo'shing:
grid.innerHTML += `
    <div class="card">
        <div class="card-image">
            <img src="${item.img}">
            <button class="compare-btn" onclick="addToCompare(${item.id})">⚖️</button>
        </div>
        <!-- ... qolgan kodlar ... -->
    </div>
`;

// JS funksiyasi:
function addToCompare(id) {
    let list = JSON.parse(localStorage.getItem('compare_list')) || [];
    const product = allProducts.find(p => p.id === id);
    
    if(!list.find(p => p.id === id)) {
        list.push(product);
        localStorage.setItem('compare_list', JSON.stringify(list));
        alert("Solishtirishga qo'shildi! ⚖️");
    }
}

    </script>
    <script src="{% static 'js/ios26-motion.js' %}"></script>
</body>
</html>
