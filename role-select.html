<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Marketly - Rolni Tasdiqlash</title>
    <link rel="stylesheet" href="role-select.css"> <!-- Avvalgi CSS'ni ishlatamiz -->
    <style>
        .role-container { display: flex; gap: 25px; margin-top: 30px; }
        .role-card {
            flex: 1; background: rgba(255,255,255,0.1);
            padding: 40px 20px; border-radius: 20px;
            border: 2px solid transparent; cursor: pointer;
            transition: 0.3s; text-align: center;
        }
        .role-card:hover { border-color: #f1c40f; transform: translateY(-10px); }
        .role-card i { font-size: 50px; display: block; margin-bottom: 15px; }
        .role-card h3 { color: #f1c40f; margin-bottom: 10px; }
        .selected { background: #f1c40f !important; color: #333 !important; }
        .selected h3 { color: #333 !important; }
    </style>
</head>
<body>

<div class="container">
    <section class="profile-card">
        <div class="step-num">3</div>
        <h2>Siz kimsiz?</h2>
        <p>Platformadan qanday maqsadda foydalanmoqchisiz? Tanlovingizga qarab xizmatlar moslashtiriladi.</p>

        <div class="role-container">
            <div class="role-card" onclick="selectRole(this, 'Tadbirkor')">
                <i>🏢</i>
                <h3><a href="tadbirkor.html">Tadbirkor</a></h3>
                <p style="font-size: 13px;">O'z mahsulotlarini sotish va biznesni rivojlantirish uchun.</p>
            </div>
            <div class="role-card" onclick="selectRole(this, 'Xaridor')">
                <i>🛒</i>
                <h3><a href="xaridor.html">Xaridor</a></h3>
                <p style="font-size: 13px;">Sifatli mahsulot va xizmatlarni qidirish uchun.</p>
            </div>
        </div>

        <button id="finalSubmit" style="margin-top: 30px; display: none;" onclick="completeRegistration()">To'liq Yakunlash ✅</button>
    </section>
</div>

<script>
// profile.html ichidagi script:
document.getElementById('profileForm').onsubmit = function(e) {
    e.preventDefault();
    function completeRegistration() {
    const profileData = JSON.parse(localStorage.getItem('marketly_profile')) || {};
    const finalPayload = { ...profileData, role: selectedRole };

    fetch('/save-final-user', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(finalPayload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "OK") {
            localStorage.clear();
            // Server aytgan sahifaga o'tamiz
            window.location.href = data.redirectUrl;
        }
    });
}


    const profileData = {
        firstname: document.getElementById('firstname').value,
        lastname: document.getElementById('lastname').value,
        age: document.getElementById('age').value,
        phone: document.getElementById('phone').value,
        email: localStorage.getItem('user_email') // Agar avval saqlangan bo'lsa
    };

    localStorage.setItem('marketly_profile', JSON.stringify(profileData));
    window.location.href = "role-select.html"; // Rol tanlashga o'tish
};


    let selectedRole = "";

    function selectRole(element, role) {
        // Hamma kartalardan 'selected' klassini olib tashlash
        document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
        // Tanlanganiga qo'shish
        element.classList.add('selected');
        selectedRole = role;
        // Tugmani ko'rsatish
        document.getElementById('finalSubmit').style.display = "block";
    }

    function completeRegistration() {
        // LocalStorage'dan barcha ma'lumotlarni yig'ish
        const profileData = JSON.parse(localStorage.getItem('marketly_profile')) || {};
        const finalPayload = { ...profileData, role: selectedRole };

        fetch('/save-final-user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(finalPayload)
        })
        .then(res => res.json())
        .then(data => {
            alert("Tabriklaymiz! Ro'yxatdan o'tish muvaffaqiyatli yakunlandi.");
            localStorage.clear(); // Tozalash
            window.location.href = "index.html"; // Bosh sahifaga
        });
    }
</script>
</body>
</html>
