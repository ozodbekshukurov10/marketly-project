<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketly - Xaridor Paneli</title>
    <link rel="stylesheet" href="xaridor.css">
    <link rel="stylesheet" href="solishtirish.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Xaridor Header -->
    <header class="buyer-header">
        <div class="container header-flex">
            <div class="logo" onclick="window.location.href='feed.html'">
                Marketly<span>.</span>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" oninput="searchProducts()" placeholder="Xohlagan narsangizni qidiring...">
                <button>🔍</button>
            </div>

            <div class="buyer-menu">
                <a href="#" class="menu-item">
                    <span class="icon">❤️</span>
                    <span>Saralanganlar</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="icon">🛒</span>
                    <span class="cart-count">0</span>
                    <span>Savatcha</span>
                </a>
                <a href="kabinet.html" class="menu-item profile-btn">
                    <span class="icon">👤</span>
                    <span id="buyerName">Profil</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Reklama Banneri -->
        <div class="promo-banner">
            <div class="banner-text">
                <h2>Bahorgi Chegirmalar! 🌸</h2>
                <p>Barcha xizmatlar va mahsulotlar 100% BEPUL.</p>
                <button class="banner-btn">Batafsil</button>
            </div>
        </div>

        <!-- Kategoriyalar -->
        <div class="category-list">
            <button class="cat-item active">Hammasi</button>
            <button class="cat-item">Elektronika</button>
            <button class="cat-item">Maishiy texnika</button>
            <button class="cat-item">Kiyimlar</button>
            <button class="cat-item">Aksessuarlar</button>
        </div>

        <!-- Mahsulotlar Grid -->
        <div class="product-grid" id="productGrid">
            <!-- JS orqali to'ldiriladi -->
        </div>
    </main>

    <script>
        // Demo Ma'lumotlar
        const products = [
            { id: 1, title: "iPhone 15 Pro Max", price: "14 500 000", img: "https://loremflickr.com" },
            { id: 2, title: "AirPods Pro 2", price: "2 300 000", img: "https://loremflickr.com" },
            { id: 3, title: "MacBook Air M2", price: "12 800 000", img: "https://loremflickr.com" },
            { id: 4, title: "Nike Sneakers", price: "850 000", img: "https://loremflickr.com" },
            { id: 5, title: "Smart Watch Ultra", price: "3 400 000", img: "https://loremflickr.com" },
            { id: 6, title: "Dizayn Xizmati", price: "Bepul", img: "https://loremflickr.com" }
        ];

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img">
                            <img src="${p.img}" alt="${p.title}" onerror="this.src='https://picsum.photos{p.id}'">
                            <span class="like">♡</span>
                        </div>
                        <div class="card-body">
                            <p class="title">${p.title}</p>
                            <p class="rating">⭐️ 4.9 (24 sharh)</p>
                            <div class="price-box">
                                <span class="price">${p.price} UZS</span>
                                <button class="add-btn">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        window.onload = function() {
            renderProducts(products);
            const user = JSON.parse(localStorage.getItem('marketly_profile'));
            if(user) document.getElementById('buyerName').innerText = user.firstname;
        }
    </script>
</body>
</html>
